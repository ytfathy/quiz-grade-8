["What is the impact of mutations in asexual reproduction?",["They create genetic diversity","No impact","They prevent reproduction","They make offspring identical"],0,"Mutations are the main source of variation in clones."]]},
{t:"W6 HW U2 L3 E1 · Genetic factors & pollination",q:[
["What happens to seeds after passing through an animal’s digestive system?",["They grow inside the animal","They become inedible","They are destroyed","They are deposited away from the parent plant"],3,"Seeds are dropped in new places."],
["Which feature helps seeds attach to animals?",["Smooth surface","Bright colors","Sweet scent","Hooks, barbs, or sticky mucus"],3,"They cling to fur."],
["What is the function of nectar in flowers?",["To provide energy and nutrients to animals","To help photosynthesis","To protect from diseases","To store water"],0,"Nectar is a food reward that draws pollinators."],
["How do animals contribute to seed dispersal?",["By carrying seeds on fur or feet","By eating and fully digesting seeds","By planting seeds","By watering seeds"],0,"Seeds hitch rides on animals."],
["Which is a characteristic of cross-pollination?",["Pollen moves within the same plant","Pollen moves to a different plant","Pollen is not involved","Pollen is used for defense"],1,"Cross = different plant."],
["What can different forms of the same gene affect in plants? Select all that apply.",["Color","Flowering time","Growth rate","Root length"],[0,1,2,3],"Gene variants can influence all of these traits."],
["Genetic factors are traits parents pass on. What do a plant’s genes affect?",["Its color","Its location","Its traits","Its age"],2,"Genes determine traits (color is one of them)."],
["What are genetic factors responsible for in plants?",["The color of the leaves","The traits passed from parents to offspring","The height of the plant","The amount of water needed"],1,"They are the inherited traits."],
["How does self-pollination differ from cross-pollination?",["Cross doesn’t involve pollen transfer","Self involves pollen from one plant to another","Self involves pollen transfer within the same plant","Cross occurs only in non-flowering plants"],2,"Self = same plant."],
["Main benefit to plants when animals visit flowers?",["Shade","Protection from predators","Help with photosynthesis","Animals carry pollen to other flowers"],3,"Pollination."]]},
{t:"W8 CW2 · Parenting & courtship behavior",q:[
["Courtship behaviors in animals are only observed in mammals.",TF,1,"Birds, fish, insects and more show courtship."],
["Which is NOT typically involved in parenting behavior?",["Protecting the young","Feeding the young","Mating rituals","Teaching skills for survival"],2,"Mating rituals are courtship, not parenting."],
["Courtship displays are always aggressive and involve fighting between males.",TF,1,"Many involve songs, dances or gifts."],
["What is the primary purpose of courtship behavior?",["Finding food","Attracting a mate","Establishing territory","Evading predators"],1,"Courtship helps attract a mate."],
["Which animal is known for elaborate courtship dances?",["Penguins","Peafowl","Turtles","Snakes"],1,"Peacocks display their feathers."],
["In mammals, a typical form of parental investment is:",["Building nests","Feeding the young","Teaching survival skills","All of the above"],3,"Mammal parents feed, protect and teach."],
["In many bird species, both parents care for the young.",TF,0,"Birds often share incubating and feeding."],
["Male seahorses carry and protect the developing embryos in a pouch.",TF,0,"Males carry the eggs in a brood pouch."],
["A common form of courtship behavior in many bird species:",["Nest building","Vocalizations","All of the above","None of the above"],2,"Birds sing, build and display."],
["Some species of frogs guard their eggs until they hatch.",TF,0,"Parental care exists in some frogs."],
["The males of other animal species give presents to females or build structures for them.",TF,0,"E.g. bowerbirds build decorated bowers."]]},
{t:"W7 CW3 D2U2L3E2 · Courtship & asexual reproduction",q:[
["How do male fiddler crabs use their large claws to increase reproductive success?",["To dig borrows for shelter","To fight off predators","To move and attract females"],2,"They wave the large claw to attract mates."],
["Under what conditions might animals reproduce asexually?",["High competition","Shortage of food","When conditions favor rapid reproduction","Lack of water"],2,"Favorable conditions allow rapid growth."],
["Courtship behaviors are…",["How animals protect their young","Special behaviors that help organisms find a mate","How animals migrate","How animals grow"],1,"They attract mates."],
["Which bird uses colorful feathers and an elaborate dance to attract mates?",["Owl","Peacock","Chicken"],1,"The peacock’s display."],
["What role do environmental conditions play in the type of reproduction some animals use?",["They only affect sexual reproduction","No effect","They may affect whether animals reproduce asexually or sexually","They determine mate availability"],2,"Some species switch with conditions."],
["What is asexual reproduction?",["Involves genetic variation","Involves only one parent","Involves two parents","Requires a mate"],1,"One parent."],
["What happens to genetic material during asexual reproduction?",["Mixed with another organism’s genes","Remains unchanged and identical to the parent","Reduced by half","Completely altered"],1,"It is copied."],
["Why do male bowebirds build elaborate decorated structures?",["To show off wealth","To impress potential mates","To hide from predators"],1,"It’s courtship."],
["How does asexual reproduction help a species survive in certain conditions?",["By requiring more resources","By increasing genetic diversity","By allowing reproduction without mates","By slowing reproduction"],2,"No mate needed."]]}
];

const COLS=["#ff5d73","#ffb52e","#3fc1a0","#5b8cff","#a45bff","#ff8a3d"];
function confetti(n){if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;for(let k=0;k<n;k++){const d=document.createElement("div");d.className="cf";d.style.cssText=`left:${Math.random()*100}%;background:${COLS[k%6]};animation-delay:${Math.random()*.6}s;animation-duration:${2+Math.random()*1.5}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),4000)}}
let S={};try{S=JSON.parse(localStorage.getItem("g8q1")||"{}")}catch(e){}
const sv=()=>{try{localStorage.setItem("g8q1",JSON.stringify(S))}catch(e){}};
const app=document.getElementById("app"),$=s=>document.querySelector(s);
const st=i=>S[i]||(S[i]={a:[]});
function stats(i){const a=st(i).a,n=L[i].q.length;let d=0,c=0;for(let j=0;j<n;j++){if(a[j]!=null)d++;if(a[j]===1)c++}return{d,c,n}}
function home(){let D=0,N=0,C=0;
const cards=L.map((l,i)=>{const s=stats(i),p=Math.round(s.d/s.n*100);D+=s.d;N+=s.n;C+=s.c;
return `<button class="card" style="animation-delay:${i*50}ms" onclick="play(${i})"><b>Level ${i+1}</b><span>${l.t}</span><div class="bar"><i style="width:${p}%"></i></div><small>${s.d}/${s.n} answered${s.d?` · ${s.c} correct`:""}${s.d===s.n?" ✓":""}</small></button>`}).join("");
const bub=Array.from({length:12},(_,k)=>`<span class="bub" style="left:${k*8+2}%;width:${10+k%4*6}px;height:${10+k%4*6}px;background:${COLS[k%6]};animation-duration:${5+k%5}s;animation-delay:${k*.5}s"></span>`).join("");
app.innerHTML=`<div class="hero">${bub}<img src="${LOGO}" alt="International Education Egypt"><h1>Grade 8 Q1 Science Quiz</h1><p>${L.length} levels · ${N} questions · instant marking with explanations</p></div><div class="bar"><i style="width:${Math.round(D/N*100)}%"></i></div><p class="sub">Overall progress: ${D}/${N} answered · ${C} correct</p><div class="grid">${cards}</div>`;scrollTo(0,0)}
function play(i){const s=stats(i);if(s.d===s.n)return res(i);let j=0;while(st(i).a[j]!=null)j++;show(i,j)}
let sel=[];
function show(i,j){sel=[];const l=L[i],q=l.q[j],m=Array.isArray(q[2]),s=stats(i);
app.innerHTML=`<div class="top"><button class="sec" style="margin:0" onclick="home()">← Levels</button><b>Level ${i+1}</b><img class="mini" src="${LOGO}" alt="International Education Egypt"></div><div class="bar"><i id="pb" style="width:${s.d/s.n*100}%"></i></div><p class="sub" style="margin:6px 0 0">${l.t} · Question ${j+1} of ${s.n}</p>
<div class="q"><h2>${q[0]}</h2>${m?'<p class="hint">Select all that apply, then press Check.</p>':""}${q[1].map((o,k)=>`<button class="opt" onclick="pick(${i},${j},${k})">${o}</button>`).join("")}<div id="fb">${m?`<button class="pri" onclick="fin(${i},${j})">Check answer</button>`:""}</div></div>`;scrollTo(0,0)}
function pick(i,j,k){const m=Array.isArray(L[i].q[j][2]);
if(!m){sel=[k];return fin(i,j)}
sel=sel.includes(k)?sel.filter(x=>x!==k):[...sel,k];
document.querySelectorAll(".opt").forEach((b,x)=>b.classList.toggle("sel",sel.includes(x)))}
function fin(i,j){const q=L[i].q[j],A=Array.isArray(q[2])?q[2]:[q[2]];if(!sel.length)return;
const ok=sel.length===A.length&&sel.every(k=>A.includes(k));st(i).a[j]=ok?1:0;sv();if(ok)confetti(14);
document.querySelectorAll(".opt").forEach((b,k)=>{b.disabled=true;b.classList.remove("sel");if(A.includes(k))b.classList.add("ok");else if(sel.includes(k))b.classList.add("bad")});
const s=stats(i);$("#pb").style.width=s.d/s.n*100+"%";
$("#fb").innerHTML=`<div class="fb ${ok?"g":"r"}"><b>${ok?"Correct! 🎉":"Not quite."}</b> ${ok?"":"Correct answer: "+A.map(k=>q[1][k]).join("; ")+". "}<br>${q[3]}</div><button class="pri" onclick="${j+1<s.n?`show(${i},${j+1})`:`res(${i})`}">${j+1<s.n?"Next question →":"See results"}</button>`}
function res(i){const s=stats(i),p=Math.round(s.c/s.n*100);if(p>=80)confetti(70);
app.innerHTML=`<div class="q center"><div class="big">${p>=80?"🏆":p>=50?"👍":"💪"}</div><h2>Level ${i+1} complete</h2><p>${L[i].t}</p><h1>${s.c} / ${s.n} (${p}%)</h1><div class="bar"><i style="width:100%"></i></div><p class="sub">${p>=80?"Excellent work!":p>=50?"Good effort. Review the explanations and try again.":"Keep practising. Retry to improve your score."}</p><div class="row" style="justify-content:center"><button class="pri" onclick="retry(${i})">Retry level</button>${i+1<L.length?`<button class="sec" onclick="play(${i+1})">Next level →</button>`:""}<button class="sec" onclick="home()">All levels</button></div></div>`;scrollTo(0,0)}
function retry(i){S[i]={a:[]};sv();show(i,0)}
home();
</script></body></html>
